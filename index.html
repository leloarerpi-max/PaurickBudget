<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paurick budget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2080%2080%22%3E%3Crect%20width%3D%2280%22%20height%3D%2280%22%20rx%3D%2220%22%20fill%3D%22%232563b8%22/%3E%3Cpath%20d%3D%22M26%2060V20h16a12%2012%200%200%201%200%2024H26%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M40%2044l14%2016%22%20stroke%3D%22%239cc3f5%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2080%2080%22%3E%3Crect%20width%3D%2280%22%20height%3D%2280%22%20rx%3D%2220%22%20fill%3D%22%232563b8%22/%3E%3Cpath%20d%3D%22M26%2060V20h16a12%2012%200%200%201%200%2024H26%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M40%2044l14%2016%22%20stroke%3D%22%239cc3f5%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#dfe3ea;
  --accent:#2563b8; --accent-soft:#e3ecf8; --warn:#b5651d; --warn-soft:#f8ead9;
  --bad:#b23a3a; --bad-soft:#f6e1e1; --good:#2f7a4b; --chip:#eceff4;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#9a9ea5; --line:#30343a;
    --accent:#6ea8ec; --accent-soft:#1c2c44; --warn:#e3a35a; --warn-soft:#3a2d1d;
    --bad:#ef7d7d; --bad-soft:#3d2224; --good:#6cc38c; --chip:#2a2e33;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#9a9ea5; --line:#30343a;
  --accent:#6ea8ec; --accent-soft:#1c2c44; --warn:#e3a35a; --warn-soft:#3a2d1d;
  --bad:#ef7d7d; --bad-soft:#3d2224; --good:#6cc38c; --chip:#2a2e33;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:750}
h1 span{color:var(--accent);font-weight:500}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .label{font-weight:600;font-size:17px;min-width:150px;text-align:center}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] button.primary{color:#0d1a2b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0d1a2b}}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--ink)}
button.icon{padding:6px 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:none;background:none;border-radius:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .sum{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.gb{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.gb .wide{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:90px;resize:vertical}
.addform{display:grid;grid-template-columns:140px 1fr 150px auto;gap:10px;align-items:end}
.addform label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.amount-in{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chips-l{font-size:12px;color:var(--muted);width:100%}
.chip.main{font-weight:600;padding:7px 16px;font-size:15px}
.sub-row{margin-top:8px;gap:5px}
.sub-row .chips-l{width:auto;min-width:96px;font-weight:600}
.chip.sub{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:3px 10px}
.chip.sub:hover{color:var(--ink);border-color:var(--muted)}
.chip.sub.done{opacity:.6}
.chip.sub.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);opacity:1;font-weight:600}
.subline{font-size:12px;color:var(--muted);margin-top:6px}
.subline b{color:var(--ink);font-weight:600}
.edit td.ro{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px}
.edit input.list{font-size:13px;color:var(--muted)}
.edit td.lc{width:62%}
.chip{border-radius:999px;padding:5px 12px;background:var(--chip);border:1px solid transparent;font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cat{border-top:1px solid var(--line);padding:10px 0}
.cat:first-child{border-top:none;padding-top:0}
.cat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;user-select:none}
.cat-head .name{font-weight:600}
.cat-head .nums{font-variant-numeric:tabular-nums;font-size:14px;text-align:right;white-space:nowrap}
.cat-head .nums small{color:var(--muted)}
.bar{height:7px;background:var(--chip);border-radius:99px;margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--bad)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;margin-left:6px;font-weight:600}
.tag.over{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.items{margin:8px 0 0;padding:0;list-style:none}
.items li{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:14px}
.items li:hover{background:var(--chip)}
.items .d{color:var(--muted);width:48px;flex:none;font-variant-numeric:tabular-nums}
.items .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items .m{font-variant-numeric:tabular-nums;font-weight:600}
.items .c{font-size:12px;color:var(--muted);background:var(--chip);border-radius:99px;padding:1px 8px}
table{width:100%;border-collapse:collapse}
.edit td{padding:3px 4px;vertical-align:middle}
.edit input{padding:6px 8px;background:transparent;border-color:transparent}
.edit input:hover{border-color:var(--line)}
.edit input.num{text-align:right;font-variant-numeric:tabular-nums;width:100px}
.edit th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:0 8px 4px}
.edit th.r{text-align:right}
.edit td.chk{width:1%;text-align:center}
.edit td.del{width:1%}
.edit input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
tr.paid input:not([type=checkbox]){color:var(--muted)}
.calc td{padding:7px 4px;font-variant-numeric:tabular-nums}
.calc td:last-child{text-align:right}
.calc tr.total td{border-top:1px solid var(--line);font-weight:650}
.calc tr.big td{font-size:18px;font-weight:700;color:var(--accent)}
.year th,.year td{padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
.year th:first-child,.year td:first-child{text-align:left}
.year th{color:var(--muted);font-weight:500}
.year td.o{color:var(--bad);font-weight:600}
.year tr.tot td{font-weight:650;border-bottom:none}
.scroll{overflow-x:auto}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .stack{width:100%;max-width:44px;position:relative;display:flex;align-items:flex-end;justify-content:center;flex:1}
.chart .b{width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.chart .b.over{background:var(--bad)}
.chart .bud{position:absolute;left:-3px;right:-3px;border-top:2px dashed var(--muted)}
.chart .lab{font-size:11px;color:var(--muted)}
.chart .val{font-size:11px;font-variant-numeric:tabular-nums}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;padding:40px 16px}
.empty p{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 10px;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:var(--card);border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px}
.opt b{display:block;margin-bottom:2px}
.opt span{font-size:13px;color:var(--muted)}
.opt[data-r=all] b{color:var(--bad)}
.opt:hover{border-color:var(--accent)}
.toast.warn{background:#b5651d;color:#fff;border-radius:12px;max-width:calc(100% - 32px);text-align:center}
.alerts{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.alerts b:first-child{color:var(--warn)}
.alerts ul{margin:4px 0 0;padding-left:18px}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.qchip{border-radius:999px;padding:4px 11px;font-size:13px;background:var(--card)}
.qchip:hover{border-color:var(--accent);color:var(--accent)}
.qchip b{font-weight:600;font-variant-numeric:tabular-nums}
.edit input.day{width:46px;text-align:center;font-variant-numeric:tabular-nums}
.soon{background:var(--accent-soft);border-radius:10px;padding:8px 6px 4px}
.soon-h{font-size:13px;font-weight:600;color:var(--accent);padding:0 8px;display:flex;justify-content:space-between}
.soon .items{margin-top:2px}
.soon .items li:hover{background:transparent}
.items .d{width:52px}
details summary{cursor:pointer;font-size:13px;padding:4px 0}
.editing{outline:2px solid var(--warn);outline-offset:4px;border-radius:8px}
@media (max-width:700px){
  .addform{grid-template-columns:1fr 1fr}
  .addform .f-lib{grid-column:1/-1;order:3}
  .addform .f-btn{grid-column:1/-1;order:4}
  .monthnav .label{min-width:120px}
  .edit input.num{width:84px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg viewBox="0 0 80 80" width="40" height="40" aria-hidden="true"><rect width="80" height="80" rx="20" fill="#2563b8"/><path d="M26 60V20h16a12 12 0 0 1 0 24H26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 44l14 16" stroke="#9cc3f5" stroke-width="7" stroke-linecap="round"/></svg><h1>Paurick <span>budget</span></h1></div>
    <div class="monthnav">
      <button class="icon" id="prev" aria-label="Mois précédent">‹</button>
      <div class="label" id="mlabel"></div>
      <button class="icon" id="next" aria-label="Mois suivant">›</button>
      <button class="ghost" id="today">Aujourd'hui</button>
    </div>
    <div class="row">
      <button id="exp" title="Télécharger une sauvegarde de toutes les données">Sauvegarder</button>
      <button id="imp" title="Restaurer depuis une sauvegarde">Restaurer</button>
      <input type="file" id="impfile" accept=".json,application/json" hidden>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs">
    <button data-t="dep">Dépenses</button>
    <button data-t="bud">Budget du mois</button>
    <button data-t="bil">Bilan & virements</button>
    <button data-t="ann">Année</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var STORE = "paurick-budget-neuf-v1";
var MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var MOIS_C = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
var fmt = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
var eur = function(n){ return fmt.format(Math.round((n||0)*100)/100); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
var num = function(v){ if(typeof v==="number") return v; var n=parseFloat(String(v||"").replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; };
var uid = function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); };
var sum = function(a,k){ return (a||[]).reduce(function(s,x){return s+num(x[k]);},0); };
var mkey = function(y,m){ return y+"-"+String(m+1).padStart(2,"0"); };
var parseKey = function(k){ var p=k.split("-"); return {y:+p[0], m:+p[1]-1}; };
var shiftKey = function(k,d){ var p=parseKey(k); var dt=new Date(p.y,p.m+d,1); return mkey(dt.getFullYear(),dt.getMonth()); };
var labelKey = function(k){ var p=parseKey(k); return MOIS[p.m]+" "+p.y; };
var todayISO = function(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

/* ---------- Départ : aucune donnée ---------- */
function seed(){ return {version:1, personnes:2, months:{}}; }

/* ---------- Stockage ---------- */
var storageOK=true, state;
try{ var raw=localStorage.getItem(STORE); state=raw?JSON.parse(raw):null; }catch(e){ storageOK=false; state=null; }
if(!state||!state.months) state=seed();
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(state)); }catch(e){ storageOK=false; showBanner(); } }
var PRELEV=["fixes","credits","epargne"];
var FIX="Charges fixes";
function fixPaid(m,nom){ return (m.depenses||[]).reduce(function(s,d){ return s+(d.cat===FIX&&d.sous===nom?num(d.montant):0); },0); }
function curKey(){ var d=new Date(); return mkey(d.getFullYear(),d.getMonth()); }
/* Mise à niveau des anciennes données : jour de prélèvement + case payé partout */
(function migrate(){
  var ck=curKey();
  Object.keys(state.months).forEach(function(k){
    var m=state.months[k];
    PRELEV.forEach(function(s){ (m[s]||[]).forEach(function(r){
      if(r.jour===undefined) r.jour="";
      if(r.paye===undefined) r.paye=k<ck;
    }); });
  });
})();
/* Coche automatiquement ce qui est déjà passé */
function autoPay(){
  var now=new Date(), ck=curKey(), day=now.getDate(), changed=false;
  var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(); if(day===dim) day=31;
  Object.keys(state.months).forEach(function(k){
    if(k>ck) return;
    var mm=state.months[k];
    PRELEV.forEach(function(s){ (mm[s]||[]).forEach(function(r){
      if(r.manuel) return;
      var hasDay=!(r.jour===""||r.jour==null);
      var byDay=hasDay&&(k<ck||+r.jour<=day);
      var byPay=false;
      if(s==="fixes"){ var pd=fixPaid(mm,r.nom); byPay=pd>0&&pd>=num(r.montant)-0.005; }
      if(!hasDay&&!byPay) return;
      var should=byDay||byPay;
      if(!!r.paye!==should){ r.paye=should; changed=true; }
    }); });
  });
  return changed;
}

/* Mise à jour des mois créés avec une ancienne version */
(function upgrade(){
  var FIXES=["Nourrice","SAUR","Assurance","Total","Jardinier","Verisure","Cantine - Garderie","Taxe","Téléphone & Télés","Epargnes"];
  var SOUS=["Restaurants","Vêtements","Travaux","Cadeaux","Coiffeur","Pharmacie","Vacances"];
  var REN={"Course":"Courses","Essence":"Essences"};
  Object.keys(state.months).forEach(function(k){
    var m=state.months[k];
    if(!m.fixes||!m.fixes.length) m.fixes=FIXES.map(function(n){return {nom:n,montant:0,jour:"",paye:false};});
    (m.budgets||[]).forEach(function(b){
      if(REN[b.cat]&&!m.budgets.some(function(x){return x.cat===REN[b.cat];})){ var o=b.cat; b.cat=REN[o]; (m.depenses||[]).forEach(function(d){ if(d.cat===o) d.cat=b.cat; }); }
      if(b.cat==="Autres"&&(!b.sous||!b.sous.length)) b.sous=SOUS.slice();
    });
    if(!m.budgets.some(function(b){return b.cat==="Autres";})) m.budgets.push({cat:"Autres",budget:0,sous:SOUS.slice()});
  });
})();
autoPay();
save();

var ui={ month:mkey(new Date().getFullYear(),new Date().getMonth()), tab:"dep", view:"cat", open:{}, selCat:null, editId:null, q:"" };
try{ var u=JSON.parse(localStorage.getItem(STORE+"-ui")||"{}"); if(u.view) ui.view=u.view; }catch(e){}
function saveUI(){ try{ localStorage.setItem(STORE+"-ui",JSON.stringify({tab:ui.tab,view:ui.view})); }catch(e){} }

function showBanner(){
  document.getElementById("banner").innerHTML = storageOK ? "" :
    '<div class="banner">Ce navigateur ne permet pas d\'enregistrer automatiquement. Pense à cliquer sur « Sauvegarder » avant de fermer la page.</div>';
}
function toast(t,warn){ var el=document.getElementById("toast"); el.textContent=t; el.classList.toggle("warn",!!warn); el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove("show");},warn?4500:1800); }
/* Ajoute une dépense et prévient si la catégorie passe 80 % ou 100 % du budget */
function addExpense(m,rec,msg){
  var b=0; m.budgets.forEach(function(x){ if(x.cat===rec.cat) b=num(x.budget); });
  var before=spentByCat(m)[rec.cat]||0;
  m.depenses.push(rec);
  var after=before+num(rec.montant);
  ui.open[rec.cat]=true;
  save(); render();
  if(b>0&&after>b&&before<=b) toast("Budget « "+rec.cat+" » dépassé de "+eur(after-b)+" !",true);
  else if(b>0&&after>=.8*b&&before<.8*b) toast("Attention : « "+rec.cat+" » à "+Math.round(after/b*100)+" % du budget (reste "+eur(b-after)+")",true);
  else toast(msg||(eur(rec.montant)+" → "+rec.cat+(rec.sous?" · "+rec.sous:"")));
}
function normTxt(t){ return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function mainCats(m){
  var c=m.budgets.map(function(b){return b.cat;});
  var ia=-1; c.forEach(function(x,i){ if(normTxt(x)==="autres"||normTxt(x)==="autre") ia=i; });
  if(c.indexOf(FIX)<0){ if(ia>=0) c.splice(ia,0,FIX); else c.push(FIX); }
  (m.depenses||[]).forEach(function(d){ if(c.indexOf(d.cat)<0) c.push(d.cat); });
  return c;
}
function subsOf(m,cat){
  if(cat===FIX) return m.fixes.map(function(f){return f.nom;}).filter(Boolean);
  var b=m.budgets.filter(function(x){return x.cat===cat;})[0];
  return (b&&b.sous)||[];
}
function matchSub(m,lib){
  var v=normTxt(lib); if(!v) return null;
  var best=null, bl=0;
  mainCats(m).forEach(function(c){ subsOf(m,c).forEach(function(sname){
    var n=normTxt(sname); if(n&&(v===n||v.indexOf(n+" ")===0)&&n.length>bl){ best={cat:c,sous:sname}; bl=n.length; }
  }); });
  return best;
}
function defaultDate(){ return ui.month===curKey()?todayISO():ui.month+"-01"; }
function frequentes(){
  var map={};
  Object.keys(state.months).sort().forEach(function(k){
    (state.months[k].depenses||[]).forEach(function(d){
      if(!d.lib||/repris de l'excel/i.test(d.lib)) return;
      var key=d.lib.trim().toLowerCase()+"|"+d.cat+"|"+(d.sous||"")+"|"+num(d.montant);
      if(!map[key]) map[key]={lib:d.lib.trim(),cat:d.cat,sous:d.sous||"",montant:num(d.montant),n:0,last:""};
      map[key].n++; if(d.date>map[key].last) map[key].last=d.date;
    });
  });
  return Object.keys(map).map(function(k){return map[k];})
    .sort(function(a,b){ return b.n-a.n || (b.last>a.last?1:-1); }).slice(0,8);
}

/* ---------- Calculs ---------- */
function M(){ return state.months[ui.month]; }
function spentByCat(m){ var r={}; (m.depenses||[]).forEach(function(d){ r[d.cat]=(r[d.cat]||0)+num(d.montant); }); return r; }
function totals(m){
  var t={};
  t.rev=sum(m.revenus,"montant");
  t.vir=m.revenus.reduce(function(s,r){ return s+(r.direct?0:num(r.virement)); },0);
  t.direct=m.revenus.reduce(function(s,r){ return s+(r.direct?num(r.montant):0); },0);
  t.cred=sum(m.credits,"montant"); t.ep=sum(m.epargne,"montant");
  var noms={}; t.fixPrevu=0; t.fix=0;
  m.fixes.forEach(function(f){ noms[f.nom]=1; var pd=fixPaid(m,f.nom); t.fixPrevu+=num(f.montant); t.fix+=Math.max(num(f.montant),pd); });
  t.fixRegle=0; (m.depenses||[]).forEach(function(d){ if(d.cat===FIX){ t.fixRegle+=num(d.montant); if(!noms[d.sous]) t.fix+=num(d.montant); } });
  t.fixPaid=m.fixes.reduce(function(s,f){return s+(f.paye?num(f.montant):0);},0);
  t.bud=sum(m.budgets,"budget"); t.dep=(m.depenses||[]).reduce(function(s,d){ return s+(d.cat===FIX?0:num(d.montant)); },0); t.remb=sum(m.rembs,"montant");
  t.besoin=t.cred+t.ep+t.fix+t.bud;
  t.aVirer=t.besoin-t.remb-t.direct;
  t.parPers=t.aVirer/(state.personnes||2);
  return t;
}
function soldeDebut(k){ var m=state.months[k]; return m?num(m.soldePrec):0; }
function virRecus(m,t){ return m.revenus.reduce(function(s,r){ return s+(r.direct?0:(num(r.virement)||t.parPers)); },0); }
function soldeFin(k){
  var m=state.months[k], t=totals(m);
  return soldeDebut(k)+virRecus(m,t)+t.direct+t.remb-t.cred-t.ep-t.fix-t.dep;
}
function catMemory(){
  var map={};
  Object.keys(state.months).sort().forEach(function(k){
    (state.months[k].depenses||[]).forEach(function(d){
      if(d.lib && !/repris de l'excel/i.test(d.lib)){ var v={cat:d.cat,sous:d.sous||null}; map[d.lib.trim().toLowerCase()]=v; var w=d.lib.trim().toLowerCase().split(/\s+/)[0]; if(w.length>2) map["§"+w]=v; }
    });
  });
  return map;
}

/* Budget du mois (tableaux éditables) */
var SECTIONS={
  revenus:{titre:"Revenus",cols:[{k:"nom",h:"Type"},{k:"montant",h:"Montant",n:1},{k:"virement",h:"Viré au commun",n:1},{k:"direct",h:"Versé direct",c:1}],sumk:"montant",help:"« Versé direct » : arrive directement sur le compte commun (ex. CAF) et réduit le virement de chacun."},
  credits:{titre:"Crédits",cols:[{k:"paye",h:"Payé",c:1},{k:"nom",h:"Type"},{k:"jour",h:"Jour",d:1},{k:"montant",h:"Montant",n:1}],sumk:"montant"},
  epargne:{titre:"Épargne",cols:[{k:"paye",h:"Payé",c:1},{k:"nom",h:"Pour"},{k:"jour",h:"Jour",d:1},{k:"montant",h:"Montant",n:1}],sumk:"montant"},
  fixes:{titre:"Charges fixes",cols:[{k:"paye",h:"Payé",c:1},{k:"nom",h:"Catégorie"},{k:"jour",h:"Jour",d:1},{k:"montant",h:"Prévu",n:1},{k:"_regle",h:"Réglé",ro:1}],sumk:"montant",help:"« Prévu » : le montant habituel. « Réglé » : ce que tu as saisi dans Dépenses → Charges fixes ; la ligne se coche quand le prévu est atteint. Avec un jour de prélèvement, elle se coche aussi toute seule une fois ce jour passé."},
  budgets:{titre:"Budgets / charges variables",cols:[{k:"cat",h:"Catégorie"},{k:"sous",h:"Sous-catégories",l:1},{k:"budget",h:"Budget",n:1}],sumk:"budget",help:"Ces catégories sont les boutons de l'onglet Dépenses (« Charges fixes » s'ajoute toute seule). Sous-catégories séparées par « / », elles apparaissent en grisé sous les boutons."},
  rembs:{titre:"Remboursements",cols:[{k:"nom",h:"Type"},{k:"montant",h:"Montant",n:1}],sumk:"montant"}
};
function renderBud(m){
  var h='<div class="grid gb">';
  ["fixes","budgets","revenus","credits","epargne","rembs"].forEach(function(s){ h+=secCard(m,s); });
  h+='<div class="card"><h2>Notes du mois</h2><textarea data-notes placeholder="Soldes relevés, remboursements attendus, dépenses exceptionnelles…">'+esc(m.notes)+'</textarea></div>';
  h+='</div>';
  h+='<div class="row" style="justify-content:flex-end">'+'<button class="ghost" data-act="reset-open">↺ Réinitialiser '+labelKey(ui.month)+'</button>'+'<button class="ghost" data-act="del-month" style="color:var(--bad)">Supprimer '+labelKey(ui.month)+'</button></div>';
  return h;
}
function secCard(m,s){
  var S=SECTIONS[s], rows=m[s];
  var extra=PRELEV.indexOf(s)>=0?' <small class="muted">· reste à prélever '+eur(sum(rows,"montant")-rows.reduce(function(a,f){return a+(f.paye?num(f.montant):0);},0))+'</small>':"";
  var h='<div class="card'+(s==="fixes"||s==="budgets"?' wide':'')+'"><h2><span>'+S.titre+extra+'</span><span class="sum" id="sum-'+s+'">'+eur(sum(rows,S.sumk))+'</span></h2><table class="edit"><thead><tr>';
  S.cols.forEach(function(c){ h+='<th class="'+(c.n||c.ro?"r":"")+'">'+c.h+'</th>'; }); h+='<th></th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    h+='<tr class="'+(PRELEV.indexOf(s)>=0&&r.paye?"paid":"")+'">';
    S.cols.forEach(function(c){
      if(c.ro){ var pdv=fixPaid(m,r.nom); h+='<td class="ro">'+(pdv?eur(pdv):'')+'</td>'; }
      else if(c.l) h+='<td class="lc"><input class="list" data-s="'+s+'" data-i="'+i+'" data-k="'+c.k+'" value="'+esc((r[c.k]||[]).join(" / "))+'" placeholder="aucune (facultatif)"></td>';
      else if(c.d) h+='<td style="text-align:center"><input class="day" inputmode="numeric" placeholder="–" data-s="'+s+'" data-i="'+i+'" data-k="'+c.k+'" value="'+esc(r[c.k])+'" aria-label="Jour du prélèvement"></td>';
      else if(c.c) h+='<td class="chk"><input type="checkbox" data-s="'+s+'" data-i="'+i+'" data-k="'+c.k+'"'+(r[c.k]?" checked":"")+' aria-label="'+c.h+'"></td>';
      else if(c.n) h+='<td style="text-align:right"><input class="num" inputmode="decimal" data-s="'+s+'" data-i="'+i+'" data-k="'+c.k+'" value="'+(r[c.k]===""||r[c.k]==null?"":String(r[c.k]).replace(".",","))+'"'+(s==="revenus"&&c.k==="virement"&&r.direct?' disabled title="Versé directement"':'')+'></td>';
      else h+='<td><input data-s="'+s+'" data-i="'+i+'" data-k="'+c.k+'" value="'+esc(r[c.k])+'"></td>';
    });
    h+='<td class="del"><button class="ghost" data-rm="'+s+'" data-i="'+i+'" title="Supprimer la ligne">✕</button></td></tr>';
  });
  h+='</tbody></table><div class="row" style="margin-top:8px;justify-content:space-between"><button class="ghost" data-add="'+s+'">+ Ajouter une ligne</button></div>';
  if(S.help) h+='<p class="muted" style="margin:6px 0 0">'+S.help+'</p>';
  return h+'</div>';
}

/* Bilan */
function renderBil(m){
  var t=totals(m), n=state.personnes||2;
  var sd=soldeDebut(ui.month), sf=soldeFin(ui.month);
  var resteAVivre=t.rev-t.cred-t.ep-t.fix-t.dep;
  var h='<div class="kpis">'+
    kpi("Revenus du foyer",eur(t.rev),"")+
    kpi("Sorties prévues",eur(t.cred+t.ep+t.fix+t.bud),"crédits + épargne + fixes + budget")+
    kpi("Reste après dépenses",'<span class="'+(resteAVivre<0?"neg":"pos")+'">'+eur(resteAVivre)+'</span>',"revenus − tout ce qui est sorti")+
    kpi("Solde estimé fin de mois",'<span class="'+(sf<0?"neg":"pos")+'">'+eur(sf)+'</span>',"compte commun")+
  '</div><div class="grid g2">';
  h+='<div class="card"><h2>Virement au compte commun</h2><table class="calc">'+
    tr("Crédits",t.cred)+tr("Épargne",t.ep)+tr("Charges fixes",t.fix)+tr("Budget variable",t.bud)+
    tr("Remboursements à déduire",-t.remb)+(t.direct?tr("Versements directs (CAF…)",-t.direct):"")+
    '<tr class="total"><td>Total à virer</td><td>'+eur(t.aVirer)+'</td></tr>'+
    '<tr class="big"><td>Virement par personne <small class="muted">(÷ <input id="np" inputmode="numeric" value="'+n+'" style="width:42px;padding:2px 6px;display:inline-block">)</small></td><td>'+eur(t.parPers)+'</td></tr>'+
  '</table>';
  var virs=m.revenus.filter(function(r){return !r.direct;});
  if(virs.length){
    h+='<p class="muted" style="margin:14px 0 6px">Virements saisis dans « Revenus » :</p><table class="calc">';
    virs.forEach(function(r){ var d=num(r.virement)-t.parPers; h+='<tr><td>'+esc(r.nom)+'</td><td>'+eur(r.virement)+' <small class="'+(d<-0.5?"neg":"muted")+'">('+(d>=0?"+":"")+eur(d)+')</small></td></tr>'; });
    h+='</table>';
  }
  h+='</div>';
  h+='<div class="card"><h2>Solde du compte commun (estimation)</h2><table class="calc">'+
    '<tr><td>Solde de début de mois</td><td><input id="sp" inputmode="decimal" placeholder="0,00" value="'+(m.soldePrec===""?"":String(m.soldePrec).replace(".",","))+'" style="width:130px;text-align:right;padding:4px 8px"></td></tr>'+
    tr("+ Virements reçus",virRecus(m,t))+(t.direct?tr("+ Versements directs",t.direct):"")+tr("+ Remboursements",t.remb)+
    tr("− Crédits",-t.cred)+tr("− Épargne",-t.ep)+tr("− Charges fixes",-t.fix)+tr("− Dépenses variables réelles",-t.dep)+
    '<tr class="total"><td>Solde estimé fin de mois</td><td class="'+(sf<0?"neg":"pos")+'">'+eur(sf)+'</td></tr></table>'+
    '<p class="muted" style="margin:8px 0 0">Saisis le solde relevé sur le compte en début de mois. Si un virement n\'est pas renseigné dans « Revenus », le virement conseillé ('+eur(t.parPers)+') est utilisé.</p></div>';
  h+='</div>';
  return h;
}
function tr(l,v){ return '<tr><td>'+l+'</td><td>'+eur(v)+'</td></tr>'; }

/* Année */
function renderYear(){
  var y=parseKey(ui.month).y;
  var keys=[]; for(var i=0;i<12;i++){ var k=mkey(y,i); if(state.months[k]) keys.push(k); }
  if(!keys.length) return '<div class="card empty"><p>Aucun mois enregistré en '+y+'.</p></div>';
  var cats=[]; keys.forEach(function(k){ var m=state.months[k]; m.budgets.forEach(function(b){ if(cats.indexOf(b.cat)<0) cats.push(b.cat); }); m.depenses.forEach(function(d){ if(d.cat!==FIX&&cats.indexOf(d.cat)<0) cats.push(d.cat); }); });
  var data=keys.map(function(k){ var m=state.months[k]; var b={}; m.budgets.forEach(function(x){b[x.cat]=num(x.budget);}); return {k:k,sp:spentByCat(m),b:b,t:totals(m)}; });
  var max=Math.max.apply(null,data.map(function(d){return Math.max(d.t.dep,d.t.bud);}))||1;
  var h='<div class="card"><h2>Dépenses variables '+y+' <span class="sum">'+eur(data.reduce(function(s,d){return s+d.t.dep;},0))+'</span></h2><div class="chart">';
  data.forEach(function(d){
    var p=parseKey(d.k);
    h+='<div class="col"><span class="val">'+Math.round(d.t.dep)+'</span><div class="stack"><div class="b'+(d.t.dep>d.t.bud?" over":"")+'" style="height:'+(d.t.dep/max*100)+'%"></div><div class="bud" style="bottom:'+(d.t.bud/max*100)+'%"></div></div><span class="lab">'+MOIS_C[p.m]+'</span></div>';
  });
  h+='</div><div class="legend">Barre = dépensé · pointillé = budget · rouge = budget dépassé</div></div>';
  h+='<div class="card"><h2>Par catégorie</h2><div class="scroll"><table class="year"><thead><tr><th>Catégorie</th>'+data.map(function(d){return '<th>'+MOIS_C[parseKey(d.k).m]+'</th>';}).join("")+'<th>Total</th><th>Moy./mois</th></tr></thead><tbody>';
  cats.forEach(function(c){
    var tot=0;
    h+='<tr><td>'+esc(c)+'</td>'+data.map(function(d){ var v=d.sp[c]||0; tot+=v; return '<td class="'+(v>(d.b[c]||0)&&v>0?"o":"")+'">'+(v?Math.round(v):"·")+'</td>'; }).join("")+'<td><b>'+Math.round(tot)+'</b></td><td>'+Math.round(tot/data.length)+'</td></tr>';
  });
  var g=function(f){ return data.map(function(d){return '<td>'+Math.round(f(d))+'</td>';}).join(""); };
  var gs=function(f){ return Math.round(data.reduce(function(s,d){return s+f(d);},0)); };
  h+='<tr class="tot"><td>Total variable</td>'+g(function(d){return d.t.dep;})+'<td>'+gs(function(d){return d.t.dep;})+'</td><td>'+Math.round(gs(function(d){return d.t.dep;})/data.length)+'</td></tr>';
  h+='<tr><td class="muted">Budget</td>'+g(function(d){return d.t.bud;})+'<td>'+gs(function(d){return d.t.bud;})+'</td><td></td></tr>';
  h+='<tr><td class="muted">Charges fixes</td>'+g(function(d){return d.t.fix;})+'<td>'+gs(function(d){return d.t.fix;})+'</td><td></td></tr>';
  h+='</tbody></table></div><p class="muted" style="margin:8px 0 0">En rouge : catégorie au-dessus de son budget ce mois-là.</p></div>';
  return h;
}

/* ---------- Événements ---------- */
document.getElementById("prev").onclick=function(){ ui.month=shiftKey(ui.month,-1); ui.editId=null; render(); };
document.getElementById("next").onclick=function(){ ui.month=shiftKey(ui.month,1); ui.editId=null; render(); };
document.getElementById("today").onclick=function(){ var d=new Date(); ui.month=mkey(d.getFullYear(),d.getMonth()); render(); };
document.getElementById("tabs").onclick=function(e){ var b=e.target.closest("[data-t]"); if(!b) return; ui.tab=b.dataset.t; saveUI(); render(); };

main.addEventListener("click",function(e){
  var el;
  if((el=e.target.closest("[data-toggle]"))){ var c=el.dataset.toggle; ui.open[c]=!ui.open[c]; render(); return; }
  if((el=e.target.closest("[data-view]"))){ ui.view=el.dataset.view; saveUI(); render(); return; }
  if((el=e.target.closest("[data-del]"))){
    var m=M(), d=m.depenses.filter(function(x){return x.id===el.dataset.del;})[0];
    if(d&&confirm("Supprimer "+eur(d.montant)+(d.lib?" ("+d.lib+")":"")+" ?")){ m.depenses=m.depenses.filter(function(x){return x!==d;}); if(ui.editId===d.id) ui.editId=null; save(); render(); toast("Dépense supprimée"); }
    return;
  }
  if((el=e.target.closest("[data-redo]"))){
    var m0=M(), src0=m0.depenses.filter(function(x){return x.id===el.dataset.redo;})[0];
    if(src0) addExpense(m0,{id:uid(),date:defaultDate(),montant:src0.montant,cat:src0.cat,sous:src0.sous||"",lib:src0.lib},"Refaite : "+(src0.lib||src0.cat)+" "+eur(src0.montant));
    return;
  }
  if((el=e.target.closest("[data-quick]"))){
    var f=(ui.quick||[])[+el.dataset.quick], m1=M();
    if(f){
      if(f.cat!==FIX&&!m1.budgets.some(function(b){return b.cat===f.cat;})) m1.budgets.push({cat:f.cat,budget:0});
      addExpense(m1,{id:uid(),date:defaultDate(),montant:f.montant,cat:f.cat,sous:f.sous||"",lib:f.lib},f.lib+" "+eur(f.montant)+" → "+f.cat);
    }
    return;
  }
  if((el=e.target.closest("[data-goto]"))){ e.preventDefault(); ui.tab=el.dataset.goto; saveUI(); render(); window.scrollTo(0,0); return; }
  if((el=e.target.closest("[data-edit]"))){ ui.editId=el.dataset.edit; var de=M().depenses.filter(function(x){return x.id===ui.editId;})[0]; if(de){ ui.selCat=de.cat; ui.selSous=de.sous||null; } render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if((el=e.target.closest("[data-add]"))){
    var s=el.dataset.add, row={};
    SECTIONS[s].cols.forEach(function(c){ row[c.k]=c.c?false:(c.n?0:""); });
    if(s==="budgets") row.cat="Nouvelle catégorie";
    M()[s].push(row); save(); render();
    var ins=main.querySelectorAll('input[data-s="'+s+'"]:not([type=checkbox])'); if(ins.length){ var last=ins[ins.length-SECTIONS[s].cols.filter(function(c){return !c.c;}).length]; last.focus(); last.select(); }
    return;
  }
  if((el=e.target.closest("[data-rm]"))){
    var s2=el.dataset.rm, i=+el.dataset.i, mm=M();
    if(s2==="budgets"){ var cat=mm.budgets[i].cat, n=mm.depenses.filter(function(d){return d.cat===cat;}).length; if(n&&!confirm("La catégorie « "+cat+" » contient "+n+" dépense(s). Elles resteront visibles « hors budget ». Continuer ?")) return; }
    mm[s2].splice(i,1); save(); render(); return;
  }
  if((el=e.target.closest("[data-act]"))){
    var a=el.dataset.act;
    if(a==="cancel-edit"){ ui.editId=null; render(); }
    else if(a==="create-copy"){
      var src=JSON.parse(JSON.stringify(state.months[el.dataset.src]));
      src.depenses=[]; src.notes=""; src.soldePrec=""; PRELEV.forEach(function(s){ (src[s]||[]).forEach(function(f){ f.paye=false; f.manuel=false; }); });
      state.months[ui.month]=src; save(); render(); toast(labelKey(ui.month)+" créé");
    }
    else if(a==="create-empty"){
      var L=function(a,extra){ return a.map(function(n){ var r={nom:n,montant:0}; for(var k in extra) r[k]=extra[k]; return r; }); };
      state.months[ui.month]={
        revenus:[{nom:"Salaire 1",montant:0,virement:0,direct:false},{nom:"Salaire 2",montant:0,virement:0,direct:false},{nom:"CAF",montant:0,virement:0,direct:true}],
        credits:L(["Immo 1","Immo 2","Voiture"],{jour:"",paye:false}),
        epargne:[],
        fixes:L(["Nourrice","SAUR","Assurance","Total","Jardinier","Verisure","Cantine - Garderie","Taxe","Téléphone & Télés","Epargnes"],{jour:"",paye:false}),
        budgets:[{cat:"Courses",budget:0,sous:[]},{cat:"Essences",budget:0,sous:[]},{cat:"Autres",budget:0,sous:["Restaurants","Vêtements","Travaux","Cadeaux","Coiffeur","Pharmacie","Vacances"]}],
        rembs:[{nom:"Nourrice",montant:0}],depenses:[],notes:"",soldePrec:""};
      ui.tab="bud"; saveUI();
      save(); render();
    }
    else if(a==="reset-open"){ openReset(); }
    else if(a==="del-month"){
      if(confirm("Supprimer définitivement "+labelKey(ui.month)+" et toutes ses dépenses ?")){ delete state.months[ui.month]; save(); render(); toast("Mois supprimé"); }
    }
    else if(a==="csv"){
      var m3=M(), lines=[["Date","Catégorie","Sous-catégorie","Libellé","Montant"]];
      m3.depenses.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(d){ lines.push([d.date,d.cat,d.sous||"",d.lib||"",String(d.montant).replace(".",",")]); });
      var csv="﻿"+lines.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(";");}).join("\r\n");
      download("depenses-"+ui.month+".csv",csv,"text/csv");
    }
  }
});

main.addEventListener("change",function(e){
  var el=e.target, m=M();
  if(el.dataset&&el.dataset.s){
    var s=el.dataset.s, i=+el.dataset.i, k=el.dataset.k, row=m[s][i];
    if(el.type==="checkbox"){ row[k]=el.checked; if(k==="paye") row.manuel=true; save(); render(); return; }
    var col=SECTIONS[s].cols.filter(function(c){return c.k===k;})[0];
    if(col.l){ row[k]=el.value.split("/").map(function(x){return x.trim();}).filter(Boolean); save(); return; }
    if(col.d){
      var j=parseInt(el.value,10);
      row.jour=(j>=1&&j<=31)?j:"";
      if(el.value.trim()&&row.jour==="") toast("Le jour doit être entre 1 et 31");
      row.manuel=false; save(); render(); return;
    }
    if(col.n){ row[k]=Math.round(num(el.value)*100)/100; el.value=String(row[k]).replace(".",","); }
    else {
      var v=el.value.trim();
      if(s==="budgets"&&k==="cat"){
        var old=row.cat;
        if(!v){ el.value=old; return; }
        if(m.budgets.some(function(b,j){return j!==i&&b.cat===v;})){ toast("Cette catégorie existe déjà"); el.value=old; return; }
        m.depenses.forEach(function(d){ if(d.cat===old) d.cat=v; });
      }
      if(s==="fixes"&&k==="nom"&&v&&row.nom&&v!==row.nom){ var oldN=row.nom; m.depenses.forEach(function(d){ if(d.cat===FIX&&d.sous===oldN) d.sous=v; }); }
      row[k]=v;
    }
    save();
    var sm=document.getElementById("sum-"+s); if(sm) sm.textContent=eur(sum(m[s],SECTIONS[s].sumk));
    return;
  }
  if(el.hasAttribute&&el.hasAttribute("data-notes")){ m.notes=el.value; save(); toast("Notes enregistrées"); return; }
  if(el.id==="sp"){ m.soldePrec=el.value.trim()===""?"":Math.round(num(el.value)*100)/100; save(); render(); return; }
  if(el.id==="np"){ state.personnes=Math.max(1,parseInt(el.value,10)||2); save(); render(); return; }
});

/* Réinitialiser le mois */
function openReset(){
  var m=M(); if(!m) return;
  var nd=m.depenses.length, lbl=labelKey(ui.month);
  var ov=document.createElement("div"); ov.className="modal";
  ov.innerHTML='<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="rt"><h2 id="rt">Réinitialiser '+lbl+'</h2>'+
    '<p class="muted">Les catégories, les charges fixes et leurs jours de prélèvement sont toujours conservés.</p>'+
    '<button class="opt" data-r="dep"><b>Effacer les dépenses</b><span>'+(nd===0?'Aucune dépense ce mois-ci. Décoche les charges fixes payées.':(nd===1?'Supprime la dépense du mois':'Supprime les '+nd+' dépenses du mois')+' et décoche les charges fixes payées.')+' Les montants prévus et les budgets restent.</span></button>'+
    '<button class="opt" data-r="all"><b>Tout remettre à zéro</b><span>Supprime les dépenses et les notes, et met tous les montants (revenus, charges, crédits, budgets…) à 0 €.</span></button>'+
    '<div class="row" style="justify-content:flex-end;margin-top:12px"><button data-r="cancel">Annuler</button></div></div>';
  document.body.appendChild(ov);
  var close=function(){ ov.remove(); document.removeEventListener("keydown",esc1); };
  var esc1=function(e){ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",esc1);
  ov.addEventListener("click",function(e){
    if(e.target===ov){ close(); return; }
    var b=e.target.closest("[data-r]"); if(!b) return;
    var r=b.dataset.r; if(r==="cancel"){ close(); return; }
    m.depenses=[];
    PRELEV.forEach(function(sec){ (m[sec]||[]).forEach(function(x){ x.paye=false; x.manuel=false; }); });
    if(r==="all"){
      ["revenus","credits","epargne","fixes","rembs"].forEach(function(sec){ (m[sec]||[]).forEach(function(x){ x.montant=0; if("virement" in x) x.virement=0; }); });
      m.budgets.forEach(function(b2){ b2.budget=0; });
      m.notes=""; m.soldePrec="";
    }
    ui.editId=null; save(); close(); render();
    toast(r==="all"?lbl+" remis à zéro":"Dépenses effacées ("+lbl+")");
  });
  ov.querySelector("[data-r=dep]").focus();
}

/* Sauvegarde / restauration */
function download(name,content,type){
  var blob=new Blob([content],{type:type}); var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
document.getElementById("exp").onclick=function(){ download("paurick-budget-sauvegarde-"+todayISO()+".json",JSON.stringify(state,null,1),"application/json"); toast("Sauvegarde téléchargée"); };
document.getElementById("imp").onclick=function(){ document.getElementById("impfile").click(); };
document.getElementById("impfile").onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ var d=JSON.parse(r.result); if(!d.months) throw 0;
      if(confirm("Remplacer toutes les données actuelles par cette sauvegarde ?")){ state=d; save(); render(); toast("Données restaurées"); }
    }catch(err){ alert("Ce fichier n'est pas une sauvegarde valide."); }
    e.target.value="";
  };
  r.readAsText(f);
};

render();
})();
</script>
